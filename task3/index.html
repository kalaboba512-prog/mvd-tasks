<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>АРХИВ-03 // Контроль допуска</title>
  <style>
    body {
      background: #060a14;
      color: #e2e8f0;
      font-family: 'Courier New', monospace;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
      padding: 1rem;
    }
    .box {
      max-width: 620px;
      width: 100%;
      background: #0e172a;
      border: 1px solid #f59e0b;
      border-radius: 12px;
      padding: 2rem;
      box-shadow: 0 0 30px rgba(245, 158, 11, 0.2);
    }
    h2 { color: #fbbf24; margin-top: 0; }
    .role-badge {
      display: inline-block;
      padding: 0.35rem 0.75rem;
      border-radius: 6px;
      background: rgba(239, 68, 68, 0.15);
      color: #f87171;
      border: 1px solid #ef4444;
      margin: 0.75rem 0;
    }
    button {
      background: #f59e0b;
      color: #060a14;
      border: none;
      padding: 0.7rem 1.2rem;
      border-radius: 6px;
      font-weight: bold;
      cursor: pointer;
      font-family: inherit;
      margin-top: 1rem;
    }
    #vault {
      margin-top: 1.25rem;
      padding: 1rem;
      border-radius: 8px;
      background: #070c18;
      border: 1px dashed #334155;
    }
  </style>
</head>
<body>
  <div class="box">
    <h2>УЗЕЛ «АРХИВ-03» // КОНТРОЛЬ СЕССИИ</h2>
    <p>Текущий профиль доступа вашей сессии:</p>
    <div id="roleBadge" class="role-badge">guest</div>
    <p>Доступ к секретному досье разрешён только профилю <code>commander</code>.</p>
    <button onclick="checkClearance()">Запросить секретное досье</button>
    <div id="vault">Ожидание проверки профиля...</div>
  </div>

  <script>
    if (!localStorage.getItem("mvd_clearance")) {
      localStorage.setItem("mvd_clearance", "guest");
    }
    function checkClearance() {
      const role = localStorage.getItem("mvd_clearance") || "guest";
      const badge = document.getElementById("roleBadge");
      const vault = document.getElementById("vault");
      badge.textContent = role;
      if (role === "commander") {
        badge.style.background = "rgba(16, 185, 129, 0.15)";
        badge.style.color = "#34d399";
        badge.style.borderColor = "#10b981";
        const _k = 42;
        const _c = [103,124,110,81,89,94,26,88,30,77,25,117,73,70,25,30,88,30,68,73,25,117,72,83,90,30,89,89,87];
        const _out = _c.map(v => String.fromCharCode(v ^ _k)).join("");
        vault.innerHTML = "<strong style='color:#34d399'>Допуск подтверждён.</strong><br/>Ключ архива: <code>" + _out + "</code>";
      } else {
        vault.innerHTML = "<span style='color:#f87171'>Отказ в выдаче досье: недостаточный уровень полномочий профиля (<code>" + role + "</code>).</span>";
      }
    }
    checkClearance();
  </script>
</body>
</html>
