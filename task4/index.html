<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ФОНОТЕКА // Подожду ещё немного</title>
  <style>
    :root {
      --bg: #050914;
      --panel: #0c1528;
      --border: #1e3a6e;
      --cyan: #00e5ff;
      --blue: #2563eb;
      --text: #f1f5f9;
      --muted: #94a3b8;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: radial-gradient(circle at 50% 20%, #0f2042 0%, var(--bg) 70%);
      color: var(--text);
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Courier New', sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 1.5rem;
    }
    .player-card {
      max-width: 580px;
      width: 100%;
      background: var(--panel);
      border: 1px solid rgba(0, 229, 255, 0.35);
      border-radius: 16px;
      padding: 2rem;
      box-shadow: 0 20px 55px rgba(0, 0, 0, 0.65), 0 0 30px rgba(0, 229, 255, 0.12);
    }
    .tag {
      display: inline-block;
      font-family: monospace;
      font-size: 0.78rem;
      letter-spacing: 0.08em;
      color: var(--cyan);
      border: 1px solid rgba(0, 229, 255, 0.4);
      background: rgba(0, 229, 255, 0.08);
      padding: 0.25rem 0.7rem;
      border-radius: 999px;
      margin-bottom: 1rem;
    }
    h1 {
      font-size: 1.45rem;
      margin-bottom: 0.4rem;
      color: #ffffff;
    }
    .sub {
      color: var(--muted);
      font-size: 0.9rem;
      margin-bottom: 1.4rem;
    }
    canvas {
      width: 100%;
      height: 110px;
      background: #060c1a;
      border: 1px solid rgba(148, 163, 184, 0.2);
      border-radius: 10px;
      margin-bottom: 1.1rem;
      display: block;
    }
    audio {
      width: 100%;
      margin-bottom: 1.25rem;
      border-radius: 8px;
    }
    .actions {
      display: flex;
      flex-wrap: wrap;
      gap: 0.75rem;
      align-items: center;
      justify-content: space-between;
      border-top: 1px solid rgba(148, 163, 184, 0.15);
      padding-top: 1.1rem;
    }
    .download-btn {
      display: inline-block;
      text-decoration: none;
      background: linear-gradient(135deg, #0284c7 0%, #2563eb 100%);
      border: 1px solid rgba(0, 229, 255, 0.6);
      color: #ffffff;
      font-weight: 600;
      font-size: 0.9rem;
      padding: 0.65rem 1.15rem;
      border-radius: 8px;
      transition: transform 0.15s ease, box-shadow 0.15s ease;
    }
    .download-btn:hover {
      transform: translateY(-1px);
      box-shadow: 0 6px 20px rgba(0, 229, 255, 0.35);
    }
    .file-meta {
      font-family: monospace;
      font-size: 0.8rem;
      color: var(--muted);
    }
  </style>
</head>
<body>
  <div class="player-card">
    <span class="tag">АУДИОАРХИВ // ЗАПИСЬ #04</span>
    <h1>«Подожду ещё немного»</h1>
    <p class="sub">Неизвестный исполнитель • Оригинальная цифровая копия</p>

    <canvas id="viz" width="520" height="110"></canvas>

    <audio id="track" controls preload="metadata" crossorigin="anonymous">
      <source src="./Podozhdu_eshche_nemnogo.mp3" type="audio/mpeg" />
      Ваш браузер не поддерживает воспроизведение аудио.
    </audio>

    <div class="actions">
      <a class="download-btn" href="./Podozhdu_eshche_nemnogo.mp3" download="Подожду ещё немного.mp3">
        ⬇ Скачать исходный файл (.mp3)
      </a>
      <span class="file-meta">MPEG-1 Layer 3 • 48 kHz • 3.15 МБ</span>
    </div>
  </div>

  <script>
    const audio = document.getElementById("track");
    const canvas = document.getElementById("viz");
    const ctx = canvas.getContext("2d");
    let audioCtx = null, analyser = null, dataArray = null;

    function drawIdle() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      ctx.strokeStyle = "rgba(0, 229, 255, 0.25)";
      ctx.lineWidth = 1.5;
      ctx.beginPath();
      ctx.moveTo(0, canvas.height / 2);
      ctx.lineTo(canvas.width, canvas.height / 2);
      ctx.stroke();
    }
    drawIdle();

    audio.addEventListener("play", () => {
      if (!audioCtx) {
        try {
          const AC = window.AudioContext || window.webkitAudioContext;
          audioCtx = new AC();
          const src = audioCtx.createMediaElementSource(audio);
          analyser = audioCtx.createAnalyser();
          analyser.fftSize = 128;
          src.connect(analyser);
          analyser.connect(audioCtx.destination);
          dataArray = new Uint8Array(analyser.frequencyBinCount);
        } catch (e) {
          return;
        }
      }
      if (audioCtx && audioCtx.state === "suspended") {
        audioCtx.resume();
      }
      function renderFrame() {
        if (audio.paused) return;
        requestAnimationFrame(renderFrame);
        analyser.getByteFrequencyData(dataArray);
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        const barW = (canvas.width / dataArray.length) - 2;
        for (let i = 0; i < dataArray.length; i++) {
          const h = (dataArray[i] / 255) * (canvas.height - 12);
          const x = i * (barW + 2);
          const y = canvas.height - h;
          ctx.fillStyle = "rgba(0, 229, 255, 0.8)";
          ctx.fillRect(x, y, barW, h);
        }
      }
      renderFrame();
    });
  </script>
</body>
</html>
