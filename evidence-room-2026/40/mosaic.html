<!doctype html><html lang="ru"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Разорванный отпечаток</title><style>body{background:#0b1116;color:#edf3f3;font:16px system-ui;max-width:900px;padding:24px;margin:auto}#grid{display:grid;grid-template-columns:repeat(4,1fr);max-width:640px;gap:3px}button{background:#243743;color:white;border:1px solid #64877b;cursor:pointer;padding:8px}#grid button{padding:0;aspect-ratio:1;overflow:hidden;position:relative}#grid button.selected{outline:3px solid #e7b978}img{width:100%;display:block}#grid small{position:absolute;bottom:0;right:0;background:#000b;padding:2px 6px}p{color:#afc2c8}</style><h1>Разорванный отпечаток</h1><p>Выберите два фрагмента для обмена местами. Двойное нажатие поворачивает фрагмент. На телефоне: выберите фрагмент и нажмите «Повернуть».</p><p><button id="rotate">Повернуть выбранный ↻</button> <button id="save">Скачать сборкуPNG</button> <button onclick="location.reload()">Сбросить</button></p><div id="grid"></div><canvas id="out" width="512" height="512" hidden></canvas><script>const tiles=Array.from({length:16},(_,i)=>({id:i,r:0}));let selected=null;const grid=document.querySelector('#grid');function draw(){grid.innerHTML='';tiles.forEach((t,i)=>{const b=document.createElement('button');b.ariaLabel='Фрагмент '+(i+1);b.className=selected===i?'selected':'';b.innerHTML='<img src="pieces/piece-'+String(t.id).padStart(2,'0')+'.png" alt="Фрагмент"><small>↻</small>';b.querySelector('img').style.transform='rotate('+t.r*90+'deg)';b.onclick=()=>{if(selected===null)selected=i;else if(selected===i)selected=null;else{[tiles[i],tiles[selected]]=[tiles[selected],tiles[i]];selected=null;}draw()};b.ondblclick=e=>{e.preventDefault();t.r=(t.r+1)%4;selected=i;draw()};grid.append(b)})}document.querySelector('#rotate').onclick=()=>{if(selected!==null){tiles[selected].r=(tiles[selected].r+1)%4;draw()}};document.querySelector('#save').onclick=async()=>{const c=document.querySelector('#out'),g=c.getContext('2d');g.fillStyle='white';g.fillRect(0,0,512,512);for(let i=0;i<16;i++){const t=tiles[i],im=new Image();im.src='pieces/piece-'+String(t.id).padStart(2,'0')+'.png';await im.decode();g.save();g.translate(i%4*128+64,Math.floor(i/4)*128+64);g.rotate(t.r*Math.PI/2);g.drawImage(im,-64,-64,128,128);g.restore()}const a=document.createElement('a');a.href=c.toDataURL('image/png');a.download='assembled-print.png';a.click()};draw();</script></html>
